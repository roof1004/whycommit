# 스크립트 테스트를 네 환경에서 자동으로 돌린다 (기획 9.2).
#   macOS (zsh, bash) / Windows PowerShell 5.1 / Windows Git Bash / Linux
# 각 환경에서 같은 코드로 단위 테스트를 돌리고, 셸에서 wc.mjs를 직접 불러
# 공백과 한글이 들어간 경로를 제대로 넘기는지도 확인한다.
#
# Runs the script tests automatically in four environments (spec 9.2).
#   macOS (zsh, bash) / Windows PowerShell 5.1 / Windows Git Bash / Linux
# Each environment runs the same unit tests, and also calls wc.mjs directly from the shell
# to check that paths with spaces and Korean characters are passed correctly.

name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux / bash / node 24
            os: ubuntu-latest
            shell: bash
            node: 24
          - name: linux / bash / node 18 (minimum)
            os: ubuntu-latest
            shell: bash
            node: 18
          - name: macos / zsh
            os: macos-latest
            shell: zsh {0}
            node: 24
          - name: macos / bash
            os: macos-latest
            shell: bash
            node: 24
          - name: windows / powershell 5.1
            os: windows-latest
            shell: powershell
            node: 24
          - name: windows / git bash
            os: windows-latest
            shell: bash
            node: 24
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Unit tests
        run: node test/run.mjs

      - name: Skill folder copies match their sources
        run: node tools/sync-skills.mjs --check

      # 한글은 YAML에 그대로 쓰지 않고 바이트(octal)로 만든다.
      # 셸마다 스크립트 파일을 읽는 인코딩이 달라서, YAML의 한글이 깨지면 테스트가 엉뚱하게 실패하기 때문이다.
      #
      # Korean text is not written into the YAML directly; it is built from bytes (octal).
      # Each shell reads the script file with a different encoding, and if the Korean text in the YAML got garbled,
      # the test would fail for the wrong reason.
      - name: Smoke test through the shell (path with spaces and Korean)
        if: matrix.shell != 'powershell'
        run: |
          set -eu
          KO="$(printf '\355\231\215\352\270\270\353\217\231')"
          BASE="$RUNNER_TEMP/wc smoke $KO"
          WC="$GITHUB_WORKSPACE/src/wc.mjs"
          mkdir -p "$BASE"
          node test/smoke.mjs prepare "$BASE"
          cd "$BASE/repo"
          WHYCOMMIT_HOME="$BASE/data" node "$WC" notes add --file "$BASE/in.json"
          cd "$GITHUB_WORKSPACE"
          node test/smoke.mjs verify "$BASE"

      - name: Smoke test through the shell (path with spaces and Korean)
        if: matrix.shell == 'powershell'
        run: |
          $ErrorActionPreference = 'Stop'
          $ko = -join @([char]0xD64D, [char]0xAE38, [char]0xB3D9)
          $base = Join-Path $env:RUNNER_TEMP "wc smoke $ko"
          $wc = Join-Path $env:GITHUB_WORKSPACE 'src/wc.mjs'
          New-Item -ItemType Directory -Force -Path $base | Out-Null
          node test/smoke.mjs prepare $base
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:WHYCOMMIT_HOME = Join-Path $base 'data'
          Push-Location (Join-Path $base 'repo')
          node $wc notes add --file (Join-Path $base 'in.json')
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { exit 1 }
          node test/smoke.mjs verify $base
          if ($LASTEXITCODE -ne 0) { exit 1 }
